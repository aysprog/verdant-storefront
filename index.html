<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verdant &amp; Co. — Plants &amp; Homeware</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#">Verdant &amp; Co.</a>
    <button class="cart" id="cart-btn">Cart (<span id="badge">0</span>)</button>
  </header>
  <main>
    <section class="hero">
      <h1>Plants &amp; homeware for calm homes</h1>
      <p>Healthy plants, handmade pots and the tools to keep them thriving.</p>
      <a href="#shop" class="btn">Shop now</a>
    </section>
    <section id="shop" class="shop">
      <h2>Shop all</h2>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search products" aria-label="Search products">
        <select id="cat" aria-label="Category">
          <option>All</option><option>Plants</option><option>Pots</option><option>Care</option><option>Decor</option>
        </select>
      </div>
      <ul id="grid" class="grid"></ul>
      <p id="empty" hidden>No products match your search.</p>
    </section>
  </main>
  <footer class="foot">© 2026 Verdant &amp; Co. Demo storefront.</footer>
  <script src="script.js"></script>
</body>
</html>
